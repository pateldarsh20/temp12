<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 400px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    h2 { margin: 0 0 12px; font-size: 18px; color: #333; }
    textarea { width: 100%; height: 200px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: monospace; resize: vertical; box-sizing: border-box; }
    .stats { margin: 8px 0; font-size: 12px; color: #666; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-secondary { background: #f1f3f4; color: #333; }
    .btn-secondary:hover { background: #e8eaed; }
    .status { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .success { color: #137333; }
    .error { color: #d93025; }
    .credit { margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; font-size: 11px; color: #9aa0a6; text-align: center; }
  </style>
</head>
<body>
  <h2>Snippet Paste</h2>
  <div class="stats">
    Words: <span id="wordCount">0</span> / 40,000 | Chars: <span id="charCount">0</span>
  </div>
  <textarea id="snippet" placeholder="Enter your snippet here (max 40,000 words)..."></textarea>
  <div class="btn-row">
    <button id="saveBtn" class="btn-primary">Save Snippet</button>
    <button id="clearBtn" class="btn-secondary">Clear</button>
  </div>
  <div id="status" class="status"></div>
  <div class="credit"></div>
  <script src="watermark.js"></script>
  <script src="popup.js"></script>
</body>
</html>
